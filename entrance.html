<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>其他游戏入口</title>
  <link rel="stylesheet" href="entrance.css">
</head>
<body>
  <main class="entrance-page">
    <header class="entrance-header">
      <p class="eyebrow">GAME ARCADE</p>
      <h1>其他游戏入口</h1>
      <p class="notice">
        温馨提示：消消乐游戏手机端暂时无法游玩；吃豆人游戏音效很神圣，不建议开启声音。
      </p>
      <p class="customize-note">
        想更换封面？修改对应卡片的 <code>data-image</code> 图片路径即可。
      </p>
    </header>

    <!-- data-image 填写相对于本文件的图片路径，例如：data-image="图片/我的封面.jpg" -->
    <section class="game-grid" aria-label="游戏入口列表">
      <a class="game-card" href="stupid bird.html" target="_blank" rel="noopener noreferrer" data-image="">
        <span class="game-card__media">
          <span class="game-card__fallback" aria-hidden="true">01</span>
        </span>
        <span class="game-card__shade" aria-hidden="true"></span>
        <span class="game-card__content">
          <span class="game-card__number">01</span>
          <span class="game-card__title">Flappy Bird</span>
          <span class="game-card__action">开始游戏 <span aria-hidden="true">↗</span></span>
        </span>
      </a>

      <a class="game-card" href="牌小游戏/index.html" target="_blank" rel="noopener noreferrer" data-image="">
        <span class="game-card__media">
          <span class="game-card__fallback" aria-hidden="true">02</span>
        </span>
        <span class="game-card__shade" aria-hidden="true"></span>
        <span class="game-card__content">
          <span class="game-card__number">02</span>
          <span class="game-card__title">扑克牌游戏</span>
          <span class="game-card__action">开始游戏 <span aria-hidden="true">↗</span></span>
        </span>
      </a>

      <a class="game-card" href="消消乐/index.html" target="_blank" rel="noopener noreferrer" data-image="">
        <span class="game-card__media">
          <span class="game-card__fallback" aria-hidden="true">03</span>
        </span>
        <span class="game-card__shade" aria-hidden="true"></span>
        <span class="game-card__content">
          <span class="game-card__number">03</span>
          <span class="game-card__title">消消乐游戏</span>
          <span class="game-card__action">开始游戏 <span aria-hidden="true">↗</span></span>
        </span>
      </a>

      <a class="game-card" href="跳跳游戏/index.html" target="_blank" rel="noopener noreferrer" data-image="">
        <span class="game-card__media">
          <span class="game-card__fallback" aria-hidden="true">04</span>
        </span>
        <span class="game-card__shade" aria-hidden="true"></span>
        <span class="game-card__content">
          <span class="game-card__number">04</span>
          <span class="game-card__title">跳跳游戏</span>
          <span class="game-card__action">开始游戏 <span aria-hidden="true">↗</span></span>
        </span>
      </a>

      <a class="game-card" href="抓虫子游戏/index.html" target="_blank" rel="noopener noreferrer" data-image="">
        <span class="game-card__media">
          <span class="game-card__fallback" aria-hidden="true">05</span>
        </span>
        <span class="game-card__shade" aria-hidden="true"></span>
        <span class="game-card__content">
          <span class="game-card__number">05</span>
          <span class="game-card__title">抓虫子游戏</span>
          <span class="game-card__action">开始游戏 <span aria-hidden="true">↗</span></span>
        </span>
      </a>

      <a class="game-card" href="猜单词游戏/index.html" target="_blank" rel="noopener noreferrer" data-image="">
        <span class="game-card__media">
          <span class="game-card__fallback" aria-hidden="true">06</span>
        </span>
        <span class="game-card__shade" aria-hidden="true"></span>

          <span class="game-card__number">06</span>
          <span class="game-card__title">猜单词游戏</span>
          <span class="game-card__action">开始游戏 <span aria-hidden="true">↗</span></span>
        </span>
      </a>

      <a class="game-card" href="吃豆人游戏/index.html" target="_blank" rel="noopener noreferrer" data-image="吃豆人游戏/告示牌.png">
        <span class="game-card__media">
          <span class="game-card__fallback" aria-hidden="true">07</span>
        </span>
        <span class="game-card__shade" aria-hidden="true"></span>
        <span class="game-card__content">
          <span class="game-card__number">07</span>
          <span class="game-card__title">吃豆人游戏</span>
          <span class="game-card__action">开始游戏 <span aria-hidden="true">↗</span></span>

      </a>

  <script src="entrance.js"></script>

</html>
